# Comprueba en cada cambio que el proyecto compila y que pasan todas las pruebas (no necesita claves ni base de datos:
# las pruebas usan un Postgres en memoria).
name: CI

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build
